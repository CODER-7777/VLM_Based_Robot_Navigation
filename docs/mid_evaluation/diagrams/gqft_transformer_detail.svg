<text x="55" y="965" font-size="21" fill="#526477" font-weight="400">Temporal attention selects useful history; CNN spatial attention selects useful image regions.</text>
<text x="55" y="1000" font-size="21" fill="#526477" font-weight="400">Pixel query affects the later projection/validity branches, not these temporal motion states.</text>
