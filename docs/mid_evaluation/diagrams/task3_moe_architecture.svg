<polygon points="1557.0,581.0 1551.0,593.0 1563.0,593.0" fill="#087f8c"/>
<text x="610" y="734" font-size="22" fill="#526477" font-weight="400">Latest observation bypass: 45 features</text>
<rect x="1370" y="720" width="375" height="200" rx="14" fill="#eff5fd" stroke="#245ec7" stroke-width="2"/>
<text x="1388" y="758" font-size="24" fill="#12243a" font-weight="700">Control execution</text>
<text x="1388" y="797" font-size="21" fill="#526477" font-weight="400">Hip target: ±0.735 rad</text>
<text x="1388" y="827" font-size="21" fill="#526477" font-weight="400">Calf upper: -0.88776 rad</text>
<text x="1388" y="857" font-size="21" fill="#526477" font-weight="400">Coupled PD + torque limits</text>
<text x="1388" y="887" font-size="21" fill="#526477" font-weight="400">Policy 50 Hz; PD 200 Hz</text>
<path d="M 1761 473 H 1775 V 832 H 1751" fill="none" stroke="#087f8c" stroke-width="3"/>
<polygon points="1751.0,832.0 1763.0,838.0 1763.0,826.0" fill="#087f8c"/>
<text x="55" y="835" font-size="23" fill="#526477" font-weight="400">All experts contribute through soft weights; no hard one-expert selection.</text>
<text x="55" y="877" font-size="22" fill="#526477" font-weight="400">Expert roles are learned features; walking/turning/stair identities are not established.</text>
<text x="55" y="923" font-size="21" fill="#526477" font-weight="400">Source: svanm2_moe_stair_sim/checkpoint_policy.py and controller.py.</text>
