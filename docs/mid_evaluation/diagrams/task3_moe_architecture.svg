<text x="1388" y="428" font-size="24" fill="#12243a" font-weight="700">Shared actor</text>
<text x="1388" y="467" font-size="21" fill="#526477" font-weight="400">32-D latent + latest 45-D obs</text>
<text x="1388" y="497" font-size="21" fill="#526477" font-weight="400">77 → 512 → 256 → 128 → 12</text>
<text x="1388" y="527" font-size="21" fill="#526477" font-weight="400">Output: 12 joint actions</text>
<path d="M 1291 473 H 1364" fill="none" stroke="#087f8c" stroke-width="3"/>
<polygon points="1364.0,473.0 1352.0,467.0 1352.0,479.0" fill="#087f8c"/>
