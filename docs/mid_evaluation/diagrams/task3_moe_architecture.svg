<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Liberation Sans, sans-serif">
<text x="55" y="68" font-size="36" font-weight="700" fill="#12243a">Task 3 | Student MoE architecture</text>
<text x="55" y="110" font-size="23" fill="#526477">Code-derived inference graph: eight latent experts blended before one shared actor</text>
<rect x="55" y="390" width="310" height="165" rx="14" fill="#eff5fd" stroke="#245ec7" stroke-width="2"/>
<text x="73" y="428" font-size="24" fill="#12243a" font-weight="700">Observation history</text>
<text x="73" y="467" font-size="21" fill="#526477" font-weight="400">5 frames × 45 features</text>
<text x="73" y="497" font-size="21" fill="#526477" font-weight="400">Oldest → newest</text>
<text x="73" y="527" font-size="21" fill="#526477" font-weight="400">Flattened input: 225-D</text>
<rect x="440" y="200" width="410" height="175" rx="14" fill="#eff5fd" stroke="#245ec7" stroke-width="2"/>
<text x="458" y="238" font-size="24" fill="#12243a" font-weight="700">Expert feature branch</text>
<text x="458" y="277" font-size="21" fill="#526477" font-weight="400">MLP: 225 → 512 → 256 → 2048</text>
<text x="458" y="307" font-size="21" fill="#526477" font-weight="400">Grouped 1×1 Conv, groups = 8</text>
<text x="458" y="337" font-size="21" fill="#526477" font-weight="400">8 expert vectors × 32 features</text>
<rect x="440" y="530" width="410" height="165" rx="14" fill="#e6f6f4" stroke="#007d79" stroke-width="2"/>
<text x="458" y="568" font-size="24" fill="#12243a" font-weight="700">Gating branch</text>
<text x="458" y="607" font-size="21" fill="#526477" font-weight="400">MLP: 225 → 512 → 256 → 8</text>
<text x="458" y="637" font-size="21" fill="#526477" font-weight="400">Softmax → weights w1...w8</text>
<text x="458" y="667" font-size="21" fill="#526477" font-weight="400">Weights sum to one</text>
<path d="M 370 473 H 400 V 287 H 434" fill="none" stroke="#087f8c" stroke-width="3"/>
<polygon points="434.0,287.0 422.0,281.0 422.0,293.0" fill="#087f8c"/>
