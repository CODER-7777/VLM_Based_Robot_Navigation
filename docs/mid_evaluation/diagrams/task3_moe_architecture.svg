<polygon points="434.0,613.0 422.0,607.0 422.0,619.0" fill="#087f8c"/>
<rect x="940" y="390" width="345" height="185" rx="14" fill="#e6f6f4" stroke="#007d79" stroke-width="2"/>
<text x="958" y="428" font-size="24" fill="#12243a" font-weight="700">Weighted latent blend</text>
<text x="958" y="467" font-size="21" fill="#526477" font-weight="400">z = sum_i wi * Ei(history)</text>
<text x="958" y="497" font-size="21" fill="#526477" font-weight="400">L2-normalize blended vector</text>
<text x="958" y="527" font-size="21" fill="#526477" font-weight="400">Output: 32-D latent</text>
<path d="M 856 287 H 903 V 448 H 934" fill="none" stroke="#087f8c" stroke-width="3"/>
<polygon points="934.0,448.0 922.0,442.0 922.0,454.0" fill="#087f8c"/>
