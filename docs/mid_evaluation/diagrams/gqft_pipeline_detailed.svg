<text x="73" y="297" font-size="21" fill="#526477" font-weight="400">Consecutive images</text>
<rect x="380" y="190" width="280" height="160" rx="14" fill="#eff5fd" stroke="#245ec7" stroke-width="2"/>
<text x="398" y="228" font-size="24" fill="#12243a" font-weight="700">Frozen SEA-RAFT</text>
<text x="398" y="267" font-size="21" fill="#526477" font-weight="400">Flow + confidence</text>
<text x="398" y="297" font-size="21" fill="#526477" font-weight="400">Validity / normalization</text>
