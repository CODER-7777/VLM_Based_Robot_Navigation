<text x="743" y="228" font-size="24" fill="#12243a" font-weight="700">CNN + spatial pooling</text>
<text x="743" y="267" font-size="21" fill="#526477" font-weight="400">Flow + x/y coordinates</text>
<text x="743" y="297" font-size="21" fill="#526477" font-weight="400">Mean/max or attention/max</text>
<text x="743" y="327" font-size="21" fill="#526477" font-weight="400">One 256-D token / step</text>
<rect x="1090" y="190" width="280" height="160" rx="14" fill="#eff5fd" stroke="#245ec7" stroke-width="2"/>
