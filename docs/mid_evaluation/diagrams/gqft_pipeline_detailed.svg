<text x="743" y="537" font-size="21" fill="#526477" font-weight="400">3-D path + ground anchor</text>
<text x="743" y="567" font-size="21" fill="#526477" font-weight="400">Camera intrinsics / height</text>
<text x="743" y="597" font-size="21" fill="#526477" font-weight="400">Pixel path: [B,Q,T+1,2]</text>
