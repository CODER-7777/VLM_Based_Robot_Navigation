<text x="743" y="802" font-size="21" fill="#526477" font-weight="400">Pixel anchor (u,v)</text>
<text x="743" y="832" font-size="21" fill="#526477" font-weight="400">Fixed-rig geometry</text>
<path d="M 875 719 V 621" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1435" y="685" width="310" height="155" rx="14" fill="#eff5fd" stroke="#245ec7" stroke-width="2" stroke-dasharray="8 6"/>
