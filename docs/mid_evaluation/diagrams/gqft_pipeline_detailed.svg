<text x="1453" y="498" font-size="24" fill="#12243a" font-weight="700">Displacement MLP</text>
<text x="1453" y="537" font-size="21" fill="#526477" font-weight="400">256 → 256 → 3</text>
<text x="1453" y="567" font-size="21" fill="#526477" font-weight="400">tanh-bounded Δx, Δy, Δz</text>
<text x="1453" y="597" font-size="21" fill="#526477" font-weight="400">Invalid time steps zeroed</text>
