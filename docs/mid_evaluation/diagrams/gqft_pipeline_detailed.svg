<text x="398" y="498" font-size="24" fill="#12243a" font-weight="700">Image trajectory</text>
<text x="398" y="537" font-size="21" fill="#526477" font-weight="400">Query-anchored pixel path</text>
<text x="398" y="567" font-size="21" fill="#526477" font-weight="400">ADE / FDE evaluation</text>
<text x="398" y="597" font-size="21" fill="#526477" font-weight="400">Not obstacle avoidance</text>
<path d="M 719 537 H 666" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
