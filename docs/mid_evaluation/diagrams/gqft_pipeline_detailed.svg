<text x="1453" y="267" font-size="21" fill="#526477" font-weight="400">4 layers · 8 heads</text>
<text x="1453" y="297" font-size="21" fill="#526477" font-weight="400">Past + current steps only</text>
<text x="1453" y="327" font-size="21" fill="#526477" font-weight="400">Motion states: [B,T,256]</text>
