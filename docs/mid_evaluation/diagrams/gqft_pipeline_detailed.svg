<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950">
<title>GQFT | Flow → temporal motion → geometric trajectory</title><desc>Code-derived architecture; the pixel query enters projection after the temporal encoder</desc>
