<text x="1453" y="762" font-size="21" fill="#526477" font-weight="400">256 → 128 → 1</text>
<text x="1453" y="792" font-size="21" fill="#526477" font-weight="400">Bounded Δyaw</text>
<text x="1453" y="822" font-size="21" fill="#526477" font-weight="400">Cumulative yaw output</text>
<path d="M 1751 270 H 1780 V 782 H 1751" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="55" y="889" font-size="21" fill="#526477" font-weight="400">Defaults shown; checkpoint configuration determines the actual architecture.</text>
<text x="55" y="922" font-size="20" fill="#526477" font-weight="400">Validity/uncertainty branches omitted. Yaw is auxiliary: the shown pixel projection consumes xyz, not predicted yaw.</text>
</g></svg>
